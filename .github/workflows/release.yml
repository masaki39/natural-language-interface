name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Pack
        run: |
          pnpm pack
          mv "natural-language-interface-${GITHUB_REF_NAME#v}.tgz" natural-language-interface.tgz
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" natural-language-interface.tgz --generate-notes --verify-tag
